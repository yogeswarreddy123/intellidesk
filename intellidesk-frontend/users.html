<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — IntelliDesk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="top-header-container"></div>

      <main class="page-content">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--text-main);">Enterprise User Directory</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Manage employee profiles, IT support agents, departments, and roles</p>
          </div>
          <button class="btn btn-primary" onclick="openAddUserModal()">+ Add User</button>
        </div>

        <!-- Search Bar -->
        <div class="card" style="padding: 1.25rem; margin-bottom: 1.25rem;">
          <div style="max-width: 400px;">
            <label class="form-label" for="user-search-input">Search Users</label>
            <input type="text" id="user-search-input" class="form-control" placeholder="Search by name or email address...">
          </div>
        </div>

        <!-- Users Table -->
        <div class="card">
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Department</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Joined Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
                <tr><td colspan="7" style="text-align: center; padding: 2rem;">Loading users...</td></tr>
              </tbody>
            </table>
          </div>

          <div class="pagination">
            <div id="user-pagination-info" style="font-size: 0.85rem; color: var(--text-muted);">
              Showing page 1 of 1
            </div>
            <div id="user-pagination-controls" class="pagination-controls"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit User Modal -->
  <div id="user-modal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="user-modal-title" style="font-size: 1.2rem; font-weight: 700;">Add New User</h3>
        <button class="btn btn-sm btn-outline" onclick="closeModal('user-modal')">&times;</button>
      </div>
      <form id="user-form" onsubmit="saveUser(event)">
        <input type="hidden" id="edit-user-id" value="">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="user-fname-input">First Name *</label>
              <input type="text" id="user-fname-input" class="form-control" required minlength="2">
            </div>
            <div class="form-group">
              <label class="form-label" for="user-lname-input">Last Name *</label>
              <input type="text" id="user-lname-input" class="form-control" required minlength="2">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="user-email-input">Email Address *</label>
            <input type="email" id="user-email-input" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="user-password-input">Password</label>
            <input type="password" id="user-password-input" class="form-control">
            <div id="user-password-hint" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">
              Must be at least 6 characters.
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="user-role-select">Role *</label>
              <select id="user-role-select" class="form-select" required>
                <option value="EMPLOYEE">EMPLOYEE</option>
                <option value="IT_AGENT">IT_AGENT</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="user-department-select">Department</label>
              <select id="user-department-select" class="form-select">
                <option value="">-- No Department --</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="user-phone-input">Phone Number</label>
            <input type="tel" id="user-phone-input" class="form-control" placeholder="+1-555-0100">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('user-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
