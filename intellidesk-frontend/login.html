<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — IntelliDesk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">

  <div style="width: 100%; max-width: 440px;">
    <!-- Logo & Brand Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 52px; height: 52px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; font-weight: bold; margin-bottom: 0.75rem; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);">
        ID
      </div>
      <h1 style="color: white; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em;">IntelliDesk</h1>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.25rem;">AI-Powered IT Service Management System</p>
    </div>

    <!-- Login Card -->
    <div class="card" style="box-shadow: var(--shadow-lg); border: 1px solid rgba(255, 255, 255, 0.1); padding: 2rem;">
      <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.25rem;">Sign In</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">Enter your corporate credentials to access your portal</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Corporate Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@intellidesk.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
            <a href="javascript:void(0)" onclick="alert('For security, password reset requests can be submitted via the Self-Service portal or contact IT Support at support@intellidesk.com.')" style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
          Sign In to Portal
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create Account</a>
      </div>

      <!-- Quick Role Demo Logins -->
      <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
        <p style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-bottom: 0.75rem;">
          Quick Demo Credentials
        </p>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
          <button type="button" class="btn btn-sm btn-outline" onclick="fillCredentials('admin@intellidesk.com', 'admin123')">
            Admin
          </button>
          <button type="button" class="btn btn-sm btn-outline" onclick="fillCredentials('agent@intellidesk.com', 'agent123')">
            IT Agent
          </button>
          <button type="button" class="btn btn-sm btn-outline" onclick="fillCredentials('employee@intellidesk.com', 'employee123')">
            Employee
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillCredentials(email, pass) {
      document.getElementById("login-email").value = email;
      document.getElementById("login-password").value = pass;
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const btn = document.getElementById("login-submit-btn");

      btn.disabled = true;
      btn.textContent = "Signing In...";

      try {
        const userData = await auth.login(email, password);
        showToast("Login successful! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 600);
      } catch (err) {
        showToast(err.message, "error");
        btn.disabled = false;
        btn.textContent = "Sign In to Portal";
      }
    });

    // Check if session expired
    if (new URLSearchParams(window.location.search).get("expired")) {
      showToast("Your session has expired. Please log in again.", "warning");
    }
  </script>
</body>
</html>
