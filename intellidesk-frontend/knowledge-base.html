<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Base — IntelliDesk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="top-header-container"></div>

      <main class="page-content">
        <!-- Search Banner -->
        <div class="kb-search-box">
          <h2 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem;">How can IT support help you today?</h2>
          <p style="color: #94a3b8; font-size: 0.95rem;">Search official guides, setup instructions, and troubleshooting steps</p>
          <div class="kb-search-input">
            <input type="text" id="kb-search" class="form-control" style="padding: 0.85rem 1.25rem; font-size: 1rem; border-radius: 9999px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);"
                   placeholder="Search IT solutions... (e.g. VPN, Wi-Fi, Password Reset, Printer)">
          </div>
        </div>

        <!-- Header Actions -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main);">Verified IT Knowledge Articles</h3>
          <button id="create-article-btn" class="btn btn-primary" style="display: none;" onclick="openModal('create-article-modal')">
            + New Article
          </button>
        </div>

        <!-- Articles Grid -->
        <div id="articles-grid" class="kb-articles-grid">
          <!-- Populated by js/knowledge-base.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- View Article Details Modal -->
  <div id="article-modal" class="modal-backdrop">
    <div class="modal-box" style="max-width: 750px;">
      <div class="modal-header">
        <div>
          <span id="modal-article-category" class="badge" style="background:#e0e7ff; color:#3730a3; margin-bottom: 0.4rem;">Network</span>
          <h3 id="modal-article-title" style="font-size: 1.25rem; font-weight: 700; color: var(--text-main);">Article Title</h3>
        </div>
        <button class="btn btn-sm btn-outline" onclick="closeModal('article-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modal-article-content" style="white-space: pre-wrap; line-height: 1.7; font-size: 0.95rem; color: #334155;"></div>
      </div>
      <div class="modal-footer" style="justify-content: space-between; align-items: center;">
        <span id="modal-article-date" style="font-size: 0.8rem; color: var(--text-muted);"></span>
        <button class="btn btn-primary" onclick="closeModal('article-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Create Article Modal (Admin / Agent) -->
  <div id="create-article-modal" class="modal-backdrop">
    <div class="modal-box" style="max-width: 750px;">
      <div class="modal-header">
        <h3 style="font-size: 1.2rem; font-weight: 700;">Publish Knowledge Article</h3>
        <button class="btn btn-sm btn-outline" onclick="closeModal('create-article-modal')">&times;</button>
      </div>
      <form id="create-article-form" onsubmit="saveArticle(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="article-title-input">Article Title *</label>
            <input type="text" id="article-title-input" class="form-control" placeholder="e.g. How to Connect to Corporate VPN" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="article-category-select">Category *</label>
              <select id="article-category-select" class="form-select" required></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="article-keywords-input">Search Keywords (comma separated)</label>
              <input type="text" id="article-keywords-input" class="form-control" placeholder="vpn, remote, network, connection">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="article-content-input">Full Article Content (Step-by-step resolution) *</label>
            <textarea id="article-content-input" class="form-control" rows="8" placeholder="Enter clear instructions, troubleshooting checkpoints, and solutions..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('create-article-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Publish Article</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/knowledge-base.js"></script>
</body>
</html>
