<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Employee Account — IntelliDesk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem;">

  <div style="width: 100%; max-width: 520px;">
    <!-- Logo & Brand Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 52px; height: 52px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; font-weight: bold; margin-bottom: 0.75rem; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);">
        ID
      </div>
      <h1 style="color: white; font-size: 1.6rem; font-weight: 700;">IntelliDesk</h1>
      <p style="color: #94a3b8; font-size: 0.9rem;">Employee Portal Registration</p>
    </div>

    <!-- Register Card -->
    <div class="card" style="box-shadow: var(--shadow-lg); border: 1px solid rgba(255, 255, 255, 0.1); padding: 2rem;">
      <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.25rem;">Create Account</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">Register to report issues and access IT support</p>

      <form id="register-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-fname">First Name *</label>
            <input type="text" id="reg-fname" class="form-control" placeholder="John" required minlength="2">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-lname">Last Name *</label>
            <input type="text" id="reg-lname" class="form-control" placeholder="Doe" required minlength="2">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Work Email *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="john.doe@intellidesk.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+1-555-0199">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-department">Department</label>
            <select id="reg-department" class="form-select">
              <option value="">Loading departments...</option>
            </select>
          </div>
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
          Complete Registration
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Load departments
      const deptSelect = document.getElementById("reg-department");
      try {
        const res = await api.get("/departments");
        if (res.success && res.data) {
          deptSelect.innerHTML = `<option value="">-- Select Department --</option>` +
            res.data.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join("");
        }
      } catch (e) {
        deptSelect.innerHTML = `<option value="">-- No Department --</option>`;
      }
    });

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("reg-submit-btn");

      const deptIdVal = document.getElementById("reg-department").value;
      const payload = {
        firstName: document.getElementById("reg-fname").value.trim(),
        lastName: document.getElementById("reg-lname").value.trim(),
        email: document.getElementById("reg-email").value.trim(),
        password: document.getElementById("reg-password").value,
        phone: document.getElementById("reg-phone").value.trim(),
        departmentId: deptIdVal ? Number(deptIdVal) : null
      };

      btn.disabled = true;
      btn.textContent = "Creating Account...";

      try {
        const res = await auth.register(payload);
        if (res.success) {
          showToast("Registration successful! Please login with your credentials.", "success");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        }
      } catch (err) {
        showToast(err.message, "error");
        btn.disabled = false;
        btn.textContent = "Complete Registration";
      }
    });
  </script>
</body>
</html>
