# Server Configuration
server.port=8080

# Spring Application
spring.application.name=intellidesk-backend

# MySQL Datasource Configuration
# Configured Database Name: root12 (creates database automatically if it doesn't exist)
# Configured Password: root24
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/root12?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root24}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Secret & Expiration (24 hours)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# AI Service Configuration (Optional external integration; falls back to built-in KB & rule engine)
intellidesk.ai.api-key=${INTELLIDESK_AI_API_KEY:}
intellidesk.ai.enabled=${INTELLIDESK_AI_ENABLED:false}

# CORS allowed origins
intellidesk.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080,null}

# Jackson Serialization
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
